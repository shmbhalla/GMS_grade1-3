<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 10 — Paul Meets Lydia in Philippi: Open Heart</title>
<link rel="stylesheet" href="../../assets/css/worksheets.css?v=3">
<style>
  *, *::before, *::after {
 box-sizing: border-box; margin: 0; padding: 0; 
  }

  @page {
 size: A4; margin: 1.2cm; 
  }

  .header {
 position: relative; z-index: 1; margin-bottom: 14px; 
  }

  .content {
 position: relative; z-index: 1; 
  }

  .river-scene {

    margin: 8px 0 14px;
    padding: 14px;
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    text-align: center;
  
  }

  .river-icon {
 font-size: 36px; letter-spacing: 6px; 
  }

  .scene-icons {
 font-size: 28px; margin: 6px 0; 
  }

  .story-text {

    font-size: 14px; color: #b0a8d0;
    line-height: 1.6; margin: 6px 0;
  
  }

  .door-box {

    text-align: center;
    margin: 14px auto;
    padding: 20px;
    border: 3px solid rgba(255,100,100,0.2);
    border-radius: 10px;
    width: 240px;
    background: rgba(255,80,80,0.04);
    position: relative;
  
  }

  .door-box::before {

    content: '❤️';
    font-size: 40px;
    opacity: 0.12;
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%,-50%);
  
  }

  .door-box .door-text {

    font-size: 15px; font-weight: 700; color: #ff9e9e;
    position: relative; z-index: 1;
  
  }
</style></head>
<body>
<div class="worksheet">
  <button class="print-btn" onclick="window.print()">🖨️ Print Worksheet</button>
  <div class="header">
    <div class="lesson-num">Lesson 10</div>
    <h1>Paul Meets Lydia in Philippi — Open Heart</h1>
    <div class="ref">Acts 16:11–15</div>
    <div class="value">💚 An Open Heart</div>
  </div>
  <div class="content">
    <div class="section-title">🌊 By the River</div>
    
    <div class="river-scene">
      <div class="river-icon">🌊🌊🌊</div>
      <div class="scene-icons">🧑‍🤝‍🧑👩‍🦰🧑‍🤝‍🧑 ➡️ 🧑‍🏫</div>
      <div class="story-text">
        Lydia was at the river praying. Paul shared about Jesus,<br>
        and God opened her heart. ❤️
      </div>
    </div>

    <div style="text-align:center;">
      <div class="door-box">
        <div class="door-text">🚪<br>Lord, open my heart<br>to hear Your Word.</div>
      </div>
    </div>

    <div class="bottom-prompt">
      <p>❓ <strong>How can you have an open heart like Lydia?</strong></p>
      <div class="answer-line"></div>
      <div class="answer-line"></div>
    </div>
  </div>
</div>
</body>
</html>
