<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jesus Feeds over 4000 People</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#7ba86a; --accent-dark:#5d8a4d;
  --cream:#fef9ef; --ink:#2e2a24; --charcoal:#2d2d2d;
  --yellow:#ffd93d; --pink:#ff5d8f; --blue:#4d96ff; --green:#4cc38a; --red:#ef476f;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Atkinson Hyperlegible','Segoe UI',Tahoma,sans-serif;
  background:var(--cream); color:var(--ink);
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}
h1,h2,h3,.btn,.page-indicator{font-family:'Fredoka','Atkinson Hyperlegible',sans-serif;}

/* progress */
.progress-bar{position:fixed;top:0;left:0;right:0;height:8px;background:rgba(45,45,45,.08);z-index:50;}
.progress-fill{height:100%;width:0;background:var(--accent);transition:width .4s ease;}

/* floating decorations */
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-13px) rotate(4deg);}}
.float-deco{position:fixed;z-index:1;pointer-events:none;opacity:.75;animation:bob 4.5s ease-in-out infinite;}

/* layout */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:30px 18px 10px;}
.book{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;width:100%;max-width:1200px;height:100%;max-height:780px;}

/* image frame */
.page-image{
  background:#fff;border:3px solid var(--charcoal);border-radius:26px;
  box-shadow:9px 9px 0 rgba(45,45,45,.14);overflow:hidden;min-height:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.page-image img{width:100%;height:100%;object-fit:contain;display:none;}
.page-image.has-img img{display:block;}
.no-img{font-size:clamp(4rem,10vw,7rem);display:none;animation:bob 3.5s ease-in-out infinite;}
.page-image:not(.has-img) .no-img{display:block;}

/* text card */
.page-text{
  background:#fff;border:3px solid var(--charcoal);border-radius:26px;
  box-shadow:9px 9px 0 rgba(45,45,45,.14);padding:26px 28px;
  display:flex;flex-direction:column;justify-content:center;overflow-y:auto;min-height:0;
}
.page-number{
  align-self:flex-start;font-family:'Fredoka';font-size:.85rem;font-weight:600;color:#9a928a;
  background:var(--cream);border:2px solid var(--charcoal);border-radius:999px;
  padding:3px 14px;margin-bottom:14px;box-shadow:3px 3px 0 rgba(45,45,45,.12);
}
.page-text h2{color:var(--accent-dark);font-size:clamp(1.35rem,2.4vw,1.9rem);line-height:1.2;margin-bottom:14px;}
.page-text p{font-size:clamp(17px,1.5vw,20px);line-height:1.65;margin-bottom:12px;}
.verse-chip{
  align-self:flex-start;background:#fffbe8;border:3px solid var(--charcoal);border-radius:999px;
  padding:6px 16px;font-weight:700;font-size:.95rem;color:#8a6d00;
  box-shadow:4px 4px 0 rgba(45,45,45,.15);margin-top:4px;
}
.verse-chip.hidden{display:none;}

/* page transition (bouncy stagger) */
@keyframes popIn{from{opacity:0;transform:translateY(24px) scale(.96);}to{opacity:1;transform:none;}}
@keyframes popInImg{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:none;}}
.page-image.go{animation:popInImg .55s cubic-bezier(.34,1.56,.64,1) both;}
.page-text.go > *{animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;}
.page-text.go > *:nth-child(1){animation-delay:.04s}
.page-text.go > *:nth-child(2){animation-delay:.12s}
.page-text.go > *:nth-child(3){animation-delay:.2s}
.page-text.go > *:nth-child(4){animation-delay:.28s}
.page-text.go > *:nth-child(5){animation-delay:.36s}
.page-text.go > *:nth-child(6){animation-delay:.44s}
.page-text.go > *:nth-child(n+7){animation-delay:.52s}

/* controls */
.controls{display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 16px 4px;}
.btn{
  border:3px solid var(--charcoal);background:var(--accent);color:#fff;border-radius:999px;
  padding:10px 24px;font-size:1.05rem;font-weight:600;cursor:pointer;
  box-shadow:5px 5px 0 var(--charcoal);transition:transform .1s, box-shadow .1s;
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--charcoal);}
.btn:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--charcoal);}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:5px 5px 0 var(--charcoal);}
.page-indicator{
  background:#fff;border:3px solid var(--charcoal);border-radius:999px;padding:8px 18px;
  box-shadow:4px 4px 0 rgba(45,45,45,.2);font-size:1rem;font-weight:600;
}
.progress-dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 16px 16px;max-width:820px;margin:0 auto;}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--charcoal);background:#fff;cursor:pointer;padding:0;transition:transform .15s;}
.dot:hover{transform:scale(1.25);}
.dot.cur{background:var(--yellow);transform:scale(1.3);}

/* quiz */
.quiz-box{margin-top:4px;}
.quiz-hud{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px;}
.quiz-hud span{background:var(--cream);border:2px solid var(--charcoal);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.95rem;}
.qq{font-weight:700;font-size:clamp(16px,1.4vw,19px);margin-bottom:10px;line-height:1.5;}
.q-opt{
  display:block;width:100%;text-align:left;margin:8px 0;padding:11px 16px;font-size:1rem;
  border:3px solid var(--charcoal);background:#fff;border-radius:14px;cursor:pointer;
  font-family:inherit;font-weight:600;box-shadow:4px 4px 0 rgba(45,45,45,.15);
  transition:transform .1s, border-color .15s;
}
.q-opt:hover{transform:translateX(4px);}
.q-opt:disabled{cursor:default;transform:none;}
.q-opt.correct{border-color:var(--green);background:#e6fbf1;box-shadow:4px 4px 0 rgba(76,195,138,.4);}
.q-opt.wrong{border-color:var(--red);background:#ffe9ee;}
.qfb{min-height:28px;font-weight:700;margin-top:8px;font-size:1.05rem;}
.q-done{text-align:center;padding-top:8px;}
.q-done .medal{font-size:4rem;display:block;animation:bob 3s ease-in-out infinite;}
.q-done p{font-size:1.3rem;font-weight:700;margin:8px 0 14px;}

/* fullscreen button */
#fs-toggle{
  position:fixed;bottom:14px;right:14px;z-index:9999;
  width:48px;height:48px;border-radius:50%;
  border:3px solid var(--charcoal);background:#fff;color:var(--accent-dark);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:4px 4px 0 rgba(45,45,45,.3);transition:transform .15s;
  -webkit-tap-highlight-color:transparent;
}
#fs-toggle:hover{transform:scale(1.1);}
#fs-toggle.active{background:var(--accent);color:#fff;}

/* confetti */
.confetti{position:fixed;top:-20px;z-index:99;pointer-events:none;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.6;}}

/* responsive */
@media (max-width:820px){
  .float-deco{display:none;}
  .stage{padding:26px 12px 8px;}
  .book{grid-template-columns:1fr;grid-template-rows:minmax(0,42%) minmax(0,1fr);gap:14px;max-width:640px;}
  .page-text{padding:18px 20px;justify-content:flex-start;}
  .page-text p{font-size:16px;}
  .btn{padding:9px 18px;font-size:.95rem;}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}
@media print{.controls,.progress-dots,#fs-toggle,.progress-bar,.float-deco{display:none!important;}}
</style>
</head>
<body>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<span class="float-deco" style="top:2.5%; left:2%; font-size:clamp(1.6rem,3vw,2.6rem);">🌾</span>
<span class="float-deco" style="top:3%; right:3%; font-size:clamp(1.6rem,3vw,2.6rem); animation-delay:1.1s;">☁️</span>
<span class="float-deco" style="bottom:12%; left:2.5%; font-size:clamp(1.4rem,2.6vw,2.2rem); animation-delay:2s;">🌻</span>

<main class="stage">
  <div class="book" id="book">
    <figure class="page-image" id="pageImage" title="Click for next page">
      <img id="slideImg" alt="Story illustration">
      <div class="no-img">📖</div>
    </figure>
    <section class="page-text" id="pageText">
      <div class="page-number" id="pageNum"></div>
      <h2 id="slideTitle"></h2>
      <div id="slideBody"></div>
      <div class="verse-chip hidden" id="verseChip"></div>
    </section>
  </div>
</main>

<div class="controls">
  <button class="btn" id="prevBtn">← Back</button>
  <span class="page-indicator" id="indicator">1 / 1</span>
  <button class="btn" id="nextBtn">Next →</button>
</div>
<div class="progress-dots" id="progressDots"></div>
<button id="fs-toggle" aria-label="Toggle fullscreen" title="Fullscreen (F key)"></button>

<script>
const slides = [
  {
    "img": "images/slide-01.jpg",
    "title": "Jesus Feeds Over 4,000",
    "text": [
      "A story from the book of Mark, chapter 8."
    ]
  },
  {
    "img": "",
    "title": "Ice Breaker — How Many?",
    "text": [
      "<strong>Guess how many people are in this room right now.</strong> (Let them guess.)",
      "Now imagine FOUR THOUSAND people — plus women and children!",
      "<strong>That's like filling this room 100 times over!</strong>",
      "And Jesus fed ALL of them with just seven loaves and a few fish. Let's see how!"
    ]
  },
  {
    "img": "images/slide-02.jpg",
    "title": "Jesus Went Up a Mountain",
    "text": [
      "After a long journey, Jesus went up on a mountainside and sat down.",
      "He was ready to teach and heal."
    ]
  },
  {
    "img": "images/slide-03.jpg",
    "title": "Huge Crowds Came",
    "text": [
      "Huge crowds came to Jesus, bringing people who were sick.",
      "They laid them at Jesus' feet, and He healed them all."
    ]
  },
  {
    "img": "images/slide-04.jpg",
    "title": "The People Were Amazed",
    "text": [
      "The people were amazed when they saw the lame walking and the blind seeing.",
      "They praised the God of Israel!"
    ]
  },
  {
    "img": "images/slide-05.jpg",
    "title": "Jesus Had Compassion",
    "text": [
      "Jesus called His disciples and said, \"I feel sorry for these people.\"",
      "\"They've been with me for three days and have nothing to eat. I don't want to send them away hungry.\""
    ]
  },
  {
    "img": "images/slide-06.jpg",
    "title": "Where Can We Get Food?",
    "text": [
      "The disciples asked, \"Where can we get enough bread in this empty place to feed so many people?\""
    ]
  },
  {
    "img": "images/slide-07.jpg",
    "title": "How Many Loaves?",
    "text": [
      "Jesus asked them, \"How many loaves do you have?\"",
      "They answered, \"Seven — and a few small fish.\""
    ]
  },
  {
    "img": "images/slide-08.jpg",
    "title": "Jesus Gave Thanks",
    "text": [
      "Jesus told the crowd to sit down. He took the seven loaves and the fish.",
      "He gave thanks to God and broke them into pieces."
    ]
  },
  {
    "img": "images/slide-09.jpg",
    "title": "The Food Multiplied!",
    "text": [
      "Jesus gave the pieces to His disciples, who gave them to the crowds.",
      "The food kept multiplying — everyone had enough!"
    ]
  },
  {
    "img": "images/slide-10.jpg",
    "title": "4,000 Men Ate",
    "text": [
      "Not counting women and children, there were 4,000 men who ate.",
      "No one was left hungry!"
    ]
  },
  {
    "img": "images/slide-11.jpg",
    "title": "Seven Baskets Left Over!",
    "text": [
      "The disciples picked up the leftovers — seven baskets full!",
      "Jesus does everything with abundance!"
    ]
  },
  {
    "img": "images/slide-12.jpg",
    "title": "Jesus Went Onward",
    "text": [
      "After sending the crowd away, Jesus got into a boat and continued His journey.",
      "He was always moving, always helping, always loving."
    ]
  },
  {
    "img": "images/slide-13.jpg",
    "title": "Jesus Cares About Our Needs",
    "text": [
      "Jesus didn't just care about teaching — He cared about hungry tummies too!",
      "<em>He sees our needs, big and small. And nothing is too hard for Him.</em>"
    ]
  },
  {
    "img": "",
    "title": "Fun Review!",
    "quiz": [
      {
        "q": "How many people did Jesus feed in this story?",
        "options": [
          "About 3,000",
          "About 4,000",
          "About 5,000",
          "About 10,000"
        ],
        "correct": 1,
        "explanation": "About 4,000 men plus women and children were fed."
      },
      {
        "q": "What did Jesus do before breaking the bread?",
        "options": [
          "Asked Philip for help",
          "Gave thanks and looked up to heaven",
          "Sent everyone home",
          "Prayed all night"
        ],
        "correct": 1,
        "explanation": "Jesus took the bread and fish, looked up to heaven, and gave thanks."
      },
      {
        "q": "How many baskets of leftovers were gathered?",
        "options": [
          "Seven baskets",
          "Twelve baskets",
          "Three baskets",
          "No baskets"
        ],
        "correct": 0,
        "explanation": "They gathered seven baskets of leftovers."
      }
    ]
  }
];

/* ---------------- engine ---------------- */
let cur = 0;
const $ = id => document.getElementById(id);
const pageImage = $('pageImage'), slideImg = $('slideImg'), pageText = $('pageText'),
      slideTitle = $('slideTitle'), slideBody = $('slideBody'), verseChip = $('verseChip'),
      pageNum = $('pageNum'), indicator = $('indicator'),
      prevBtn = $('prevBtn'), nextBtn = $('nextBtn'),
      dotsWrap = $('progressDots'), progressFill = $('progressFill');

/* dots */
slides.forEach((s, i) => {
  const d = document.createElement('button');
  d.className = 'dot'; d.title = 'Page ' + (i + 1);
  d.setAttribute('aria-label', 'Page ' + (i + 1));
  d.onclick = () => go(i);
  dotsWrap.appendChild(d);
});
const dots = [...dotsWrap.children];

function restartAnims(){
  [pageImage, pageText].forEach(el => el.classList.remove('go'));
  void pageText.offsetWidth; /* force reflow so animations restart */
  [pageImage, pageText].forEach(el => el.classList.add('go'));
}

function render(){
  const s = slides[cur];
  /* image */
  if (s.img) {
    slideImg.onerror = () => { slideImg.style.display = 'none'; };
    slideImg.style.display = '';
    slideImg.src = s.img;
    pageImage.classList.add('has-img');
  } else {
    slideImg.style.display = 'none';
    pageImage.classList.remove('has-img');
  }
  /* text */
  slideTitle.innerHTML = s.title || '';
  slideBody.innerHTML = '';
  if (s.quiz && s.quiz.length) {
    renderQuiz(s.quiz);
  } else {
    (s.text || []).forEach(t => {
      const p = document.createElement('p');
      p.innerHTML = t;
      slideBody.appendChild(p);
    });
  }
  /* verse */
  if (s.verse) { verseChip.textContent = '📜 ' + s.verse; verseChip.classList.remove('hidden'); }
  else verseChip.classList.add('hidden');
  /* chrome */
  pageNum.textContent = '📖 Page ' + (cur + 1);
  indicator.textContent = (cur + 1) + ' / ' + slides.length;
  progressFill.style.width = ((cur + 1) / slides.length * 100) + '%';
  dots.forEach((d, i) => d.classList.toggle('cur', i === cur));
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === slides.length - 1;
  restartAnims();
}

function go(n){
  cur = Math.max(0, Math.min(slides.length - 1, n));
  render();
}
function next(){ go(cur + 1); }
function prev(){ go(cur - 1); }
prevBtn.onclick = prev;
nextBtn.onclick = next;

/* keyboard */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') prev();
});
/* click on image = next page */
pageImage.onclick = next;
/* swipe */
let tx = 0;
document.addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 60) dx < 0 ? next() : prev();
}, { passive: true });

/* ---------------- quiz ---------------- */
function confetti(n = 70){
  const emojis = ['🎉','⭐','💛','🌟','✨','🎊','💚'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = Math.random() < .5 ? emojis[Math.floor(Math.random() * emojis.length)] : '';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.fontSize = (14 + Math.random() * 22) + 'px';
    c.style.background = c.textContent ? 'transparent' : 'hsl(' + Math.floor(Math.random() * 360) + ',90%,60%)';
    c.style.width = c.textContent ? 'auto' : '10px';
    c.style.height = c.textContent ? 'auto' : '10px';
    c.style.borderRadius = '3px';
    c.style.animationDuration = (1.8 + Math.random() * 2) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}

function renderQuiz(quiz){
  const box = document.createElement('div');
  box.className = 'quiz-box';
  box.innerHTML =
    '<div class="quiz-hud"><span id="qnum">Question 1 / ' + quiz.length + '</span><span>⭐ Score: <span id="qscore">0</span></span></div>' +
    '<p class="qq" id="qq"></p><div id="qopts"></div><p class="qfb" id="qfb"></p>' +
    '<div id="qdone" class="q-done" style="display:none"></div>';
  slideBody.appendChild(box);
  let qi = 0, score = 0;

  function qRender(){
    const q = quiz[qi];
    box.querySelector('#qnum').textContent = 'Question ' + (qi + 1) + ' / ' + quiz.length;
    box.querySelector('#qq').textContent = q.q;
    box.querySelector('#qfb').textContent = '';
    const opts = box.querySelector('#qopts');
    opts.innerHTML = '';
    q.options.forEach((o, oi) => {
      const b = document.createElement('button');
      b.className = 'q-opt'; b.textContent = o;
      b.onclick = () => {
        [...opts.children].forEach(x => x.disabled = true);
        if (oi === q.correct) {
          b.classList.add('correct'); score++;
          box.querySelector('#qscore').textContent = score;
          box.querySelector('#qfb').textContent = '🎉 ' + (q.explanation || 'Correct!');
        } else {
          b.classList.add('wrong');
          [...opts.children][q.correct].classList.add('correct');
          box.querySelector('#qfb').textContent = '💡 ' + (q.explanation || 'Not quite — see the highlighted answer.');
        }
        setTimeout(() => { qi++; qi < quiz.length ? qRender() : qDone(); }, oi === q.correct ? 1000 : 2400);
      };
      opts.appendChild(b);
    });
  }

  function qDone(){
    box.querySelector('#qq').style.display = 'none';
    box.querySelector('#qopts').style.display = 'none';
    box.querySelector('#qfb').style.display = 'none';
    const done = box.querySelector('#qdone');
    let medal, msg;
    if (score === quiz.length) { medal = '🏆'; msg = 'PERFECT! You are a story star!'; }
    else if (score >= quiz.length - 1) { medal = '🥇'; msg = 'Amazing work!'; }
    else if (score >= Math.ceil(quiz.length / 2)) { medal = '🥈'; msg = 'Great job!'; }
    else { medal = '💪'; msg = 'Good try! Let\'s read the story again soon!'; }
    done.innerHTML = '<span class="medal">' + medal + '</span><p>' + score + ' / ' + quiz.length + ' — ' + msg + '</p>' +
      '<button class="btn" id="qreplay">Play Again 🔄</button>';
    done.style.display = 'block';
    done.querySelector('#qreplay').onclick = () => { qi = 0; score = 0;
      box.querySelector('#qscore').textContent = 0;
      box.querySelector('#qq').style.display = '';
      box.querySelector('#qopts').style.display = '';
      box.querySelector('#qfb').style.display = '';
      done.style.display = 'none';
      qRender();
    };
    confetti(score >= quiz.length - 1 ? 100 : 40);
  }
  qRender();
}

/* ---------------- fullscreen (F key) ---------------- */
(function(){
  const btn = document.getElementById('fs-toggle');
  const iconFS = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 8 4 3 9 3"/><polyline points="20 16 20 21 15 21"/><line x1="4" y1="3" x2="11" y2="10"/><line x1="20" y1="21" x2="13" y2="14"/></svg>';
  const iconExit = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';
  const isFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const enter = () => { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch(() => {}); };
  const exit = () => { (document.exitFullscreen || document.webkitExitFullscreen).call(document).catch(() => {}); };
  const update = () => { btn.innerHTML = isFS() ? iconFS : iconExit; btn.classList.toggle('active', isFS()); };
  btn.addEventListener('click', () => isFS() ? exit() : enter());
  document.addEventListener('fullscreenchange', update);
  document.addEventListener('webkitfullscreenchange', update);
  update();
  document.addEventListener('keydown', e => {
    if (e.key !== 'f' && e.key !== 'F') return;
    const tag = document.activeElement ? document.activeElement.tagName : '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault(); isFS() ? exit() : enter();
